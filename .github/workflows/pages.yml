name: Pubblica Bali su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Preleva il sito
        uses: actions/checkout@v4
      - name: Controlla la presenza della pagina e delle risorse
        run: |
          test -f index.html
          test -f bali-assets/indonesia-bali-atlante.webp
          test -f bali-assets/bali-content.json
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepara i file pubblici
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
